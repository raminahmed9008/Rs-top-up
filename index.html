<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS Top-Up</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 25px 18px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .header p {
      color: #aaa;
    }

    .card {
      background: #151b2e;
      border: 1px solid #29324d;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #3a4565;
      background: #0d1324;
      color: white;
      margin-bottom: 15px;
      outline: none;
    }

    .diamonds {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .diamond {
      background: #202943;
      border: 1px solid #394766;
      color: white;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
    }

    .diamond:hover {
      background: #29365a;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #18a558;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn:hover {
      background: #138b49;
    }

    .notice {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>💎 RS TOP-UP</h1>
      <p>Free Fire Diamond Top-Up Demo</p>
    </div>

    <div class="card">

      <label>Free Fire UID</label>
      <input type="number" id="uid" placeholder="Enter your UID">

      <label>Select Diamonds</label>

      <div class="diamonds">
        <button class="diamond" onclick="selectDiamond(100)">💎 100 Diamonds</button>
        <button class="diamond" onclick="selectDiamond(310)">💎 310 Diamonds</button>
        <button class="diamond" onclick="selectDiamond(520)">💎 520 Diamonds</button>
        <button class="diamond" onclick="selectDiamond(1060)">💎 1060 Diamonds</button>
      </div>

      <br>

      <label>Selected Package</label>
      <input type="text" id="selected" placeholder="Select a package" readonly>

      <button class="btn" onclick="topUp()">TOP-UP NOW</button>

      <p class="notice">
        ⚠️ এটি একটি demo website। কোনো বাস্তব diamond/top-up এখানে দেওয়া হয় না।
      </p>

    </div>

    <footer>
      © 2026 RS Top-Up
    </footer>

  </div>

  <script>
    function selectDiamond(amount) {
      document.getElementById("selected").value =
        amount + " Diamonds";
    }

    function topUp() {
      const uid = document.getElementById("uid").value;
      const selected = document.getElementById("selected").value;

      if (uid === "") {
        alert("Please enter your Free Fire UID.");
        return;
      }

      if (selected === "") {
        alert("Please select a diamond package.");
        return;
      }

      alert(
        "Demo Order\n\nUID: " +
        uid +
        "\nPackage: " +
        selected +
        "\n\nThis is only a demo website."
      );
    }
  </script>

</body>
</html>
