<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RS TOP-UP | Free Fire Diamond</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080d1c;
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 20px 15px;
    }

    .header {
      text-align: center;
      padding: 20px 0;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
    }

    .subtitle {
      color: #aab2c8;
      margin-top: 8px;
    }

    .card {
      background: #131a2e;
      border: 1px solid #293553;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin-bottom: 18px;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #0b1122;
      color: white;
      border: 1px solid #35415f;
      border-radius: 9px;
      margin-bottom: 16px;
      outline: none;
      font-size: 15px;
    }

    .packages {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .package {
      background: #202943;
      color: white;
      border: 1px solid #3a4767;
      border-radius: 12px;
      padding: 15px 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .package:hover {
      background: #29365a;
    }

    .package.active {
      border-color: #18c878;
      background: #173d32;
    }

    .diamond {
      font-size: 18px;
      font-weight: bold;
    }

    .price {
      display: block;
      margin-top: 6px;
      color: #70e7ad;
    }

    .summary {
      background: #0b1122;
      border-radius: 10px;
      padding: 15px;
      margin-top: 18px;
      line-height: 1.8;
    }

    .summary span {
      color: #70e7ad;
    }

    .btn {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      background: #18a558;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #138b49;
    }

    .notice {
      text-align: center;
      color: #9099ae;
      font-size: 12px;
      margin-top: 14px;
    }

    footer {
      text-align: center;
      color: #687188;
      font-size: 13px;
      padding: 20px 0;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">💎 RS TOP-UP</div>
      <div class="subtitle">
        Free Fire Diamond Top-Up
      </div>
    </div>

    <div class="card">

      <h2>🛒 Create Your Order</h2>

      <label>Free Fire UID</label>

      <input
        type="number"
        id="uid"
        placeholder="Enter your Free Fire UID"
      >

      <label>Select Diamond Package</label>

      <div class="packages">

        <button class="package" onclick="selectPackage(100, 80, this)">
          <span class="diamond">💎 100</span>
          <span class="price">৳80</span>
        </button>

        <button class="package" onclick="selectPackage(310, 220, this)">
          <span class="diamond">💎 310</span>
          <span class="price">৳220</span>
        </button>

        <button class="package" onclick="selectPackage(520, 350, this)">
          <span class="diamond">💎 520</span>
          <span class="price">৳350</span>
        </button>

        <button class="package" onclick="selectPackage(1060, 700, this)">
          <span class="diamond">💎 1060</span>
          <span class="price">৳700</span>
        </button>

      </div>

      <div class="summary">

        <div>
          💎 Diamonds:
          <span id="summaryDiamond">Not selected</span>
        </div>

        <div>
          💰 Price:
          <span id="summaryPrice">৳0</span>
        </div>

        <div>
          🆔 UID:
          <span id="summaryUid">Not entered</span>
        </div>

      </div>

      <button class="btn" onclick="createOrder()">
        CONTINUE ORDER
      </button>

      <p class="notice">
        নিরাপত্তার জন্য কোনো Free Fire password বা OTP প্রয়োজন নেই।
      </p>

    </div>

    <footer>
      © 2026 RS TOP-UP
    </footer>

  </div>


  <script>

    let selectedDiamond = 0;
    let selectedPrice = 0;

    function selectPackage(diamond, price, button) {

      selectedDiamond = diamond;
      selectedPrice = price;

      document.querySelectorAll(".package").forEach(function(btn) {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      document.getElementById("summaryDiamond").innerText =
        diamond + " Diamonds";

      document.getElementById("summaryPrice").innerText =
        "৳" + price;

      updateUID();
    }


    document.getElementById("uid").addEventListener("input", function() {
      updateUID();
    });


    function updateUID() {

      const uid = document.getElementById("uid").value;

      document.getElementById("summaryUid").innerText =
        uid || "Not entered";
    }


    function createOrder() {

      const uid = document.getElementById("uid").value;

      if (uid === "") {
        alert("Please enter your Free Fire UID.");
        return;
      }

      if (selectedDiamond === 0) {
        alert("Please select a Diamond package.");
        return;
      }

      const orderId =
        "RS" +
        Date.now().toString().slice(-8);

      alert(
        "Order Created!\\n\\n" +
        "Order ID: " + orderId +
        "\\nUID: " + uid +
        "\\nDiamonds: " + selectedDiamond +
        "\\nPrice: ৳" + selectedPrice
      );
    }

  </script>

</body>
</html>
